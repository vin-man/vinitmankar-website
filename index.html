<style>
body{margin:0}
/* Let the glass Möbius blend with the whole page, so no box shows when the page tints on Work hover. */
.hero-pin{isolation:auto}
.project-card{transition:transform .35s cubic-bezier(.2,.75,.25,1),box-shadow .35s ease,border-color .35s ease}
.project-card:hover{transform:translateY(-6px);box-shadow:0 28px 60px -24px rgba(25,27,23,.28);border-color:var(--ink)!important}
.project-card .serif-link span{display:inline-block;transition:transform .35s ease}
.project-card:hover .serif-link{color:var(--orange)}
.project-card:hover .serif-link span{transform:translate(4px,-4px)}
.footer-button{transition:background .25s ease,transform .25s ease}
.footer-button:hover{background:#ffd57e!important;transform:translateY(-2px)}
.footer-closing nav a:hover,.footer-closing .footer-bottom a:hover{color:var(--orange)}
.footer-closing:after{display:none}
.next-project-image{transition:transform .8s cubic-bezier(.2,.75,.25,1),filter .6s ease;filter:grayscale(.35)}
.next-project-title,.next-project-arrow{transition:color .35s ease,transform .45s cubic-bezier(.2,.75,.25,1)}
.next-project-arrow{display:inline-block}
.next-project-video{position:absolute;inset:0;z-index:0;display:block;width:100%;height:100%;object-fit:contain;background:#fbfbfb}
.next-project-media:has(.next-project-video):after{content:"";position:absolute;inset:0;z-index:1;pointer-events:none;box-shadow:inset 0 0 90px #060b2d6b}
.next-project-media .next-project-pill{z-index:2}
.next-project-pill{opacity:0;transform:translate(-50%,-50%) scale(.9);transition:opacity .35s ease,transform .45s cubic-bezier(.2,.75,.25,1)}
.next-project:hover .next-project-image,.next-project:focus-visible .next-project-image{transform:scale(1.05);filter:grayscale(0)}
.next-project:hover .next-project-title,.next-project:focus-visible .next-project-title{color:var(--orange)}
.next-project:hover .next-project-arrow,.next-project:focus-visible .next-project-arrow{transform:translateX(12px);color:var(--orange)}
.next-project:hover .next-project-pill,.next-project:focus-visible .next-project-pill{opacity:1;transform:translate(-50%,-50%) scale(1)}
@media (max-width:700px){.next-project-media{height:320px!important}}
@media (prefers-reduced-motion:reduce){.next-project-image,.next-project-title,.next-project-arrow,.next-project-pill{transition:none}.next-project:hover .next-project-image,.next-project:focus-visible .next-project-image{transform:none}.next-project:hover .next-project-arrow,.next-project:focus-visible .next-project-arrow{transform:none}.next-project:hover .next-project-pill,.next-project:focus-visible .next-project-pill{transform:translate(-50%,-50%)}}
@media (prefers-reduced-motion:reduce){.footer-button{transition:none}.footer-button:hover{transform:none}}
@media (prefers-reduced-motion:reduce){.project-card,.project-card .serif-link span{transition:none}.project-card:hover{transform:none}.project-card:hover .serif-link span{transform:none}}
@media (prefers-reduced-motion:no-preference){.page-root{transition:background-color .8s ease}.work-item{transition:padding .35s cubic-bezier(.2,.75,.25,1)}.work-dot{transition:transform .35s ease}}
.work-item:hover,.work-item:focus-visible,.work-item[data-active="true"]{padding-left:14px!important}
.work-item[data-active="true"] .work-dot{transform:scale(1.6)}
.nav-work-toggle:hover{color:var(--orange)!important}
@media (max-width:600px){.work-meta{display:none}.work-item{grid-template-columns:36px minmax(0,1fr) 14px!important}}
.nav-links{position:relative;z-index:30}
@media (prefers-reduced-motion:no-preference){.work-pop-item{transition:color .25s ease,padding .3s ease}}
.work-pop-item[data-active="true"]{padding-left:16px!important}
@media (max-width:600px){.footer-closing{padding:72px 0 24px!important}.footer-closing .footer-cta-block{padding-bottom:40px!important;gap:20px!important}.footer-closing .footer-heading{font-size:48px!important;letter-spacing:-0.05em!important;line-height:1!important}.footer-closing .footer-contact-row{flex-direction:column!important;align-items:flex-start!important}.footer-closing .footer-links{padding:20px 0 0!important}}
/* phones: the email moves under the 'Mankar 2026' wordmark (same element, reordered; desktop untouched) */
@media (max-width:600px){.footer-closing .footer-cta-block{align-items:flex-start!important}.footer-closing .footer-contact-row,.footer-closing .footer-links{display:contents!important}.footer-closing .footer-contact-row>.footer-eyebrow:first-child{order:0}.footer-closing .footer-heading{order:1}.footer-closing .footer-wordmark{order:2;margin-top:12px}.footer-closing .footer-email{order:3;margin-top:-14px!important}.footer-closing .footer-links>nav{order:4}}

@media (prefers-reduced-motion:no-preference){.mobius-loader-dot{animation:mobiusLoaderTrail var(--loader-dur,2.4s) linear infinite;animation-delay:calc(var(--loader-dur,2.4s) * var(--f,0) * -1);transform-box:fill-box;transform-origin:center}}
@keyframes mobiusLoaderTrail{0%{opacity:var(--o);transform:scale(1.45)}12%{opacity:var(--o);transform:scale(1.1)}50%{opacity:calc(var(--o) * .3);transform:scale(.85)}100%{opacity:var(--o);transform:scale(1.45)}}
/* footer words: creativity -> art, logic -> science. Each word pair shares one grid cell sized to its longer word, so the loader never moves. */
.word-swap-b{opacity:0}
@media (prefers-reduced-motion:no-preference){
.word-swap-a{animation:wordSwapA var(--swap-dur,6s) cubic-bezier(.65,0,.35,1) infinite}
.word-swap-b{animation:wordSwapB var(--swap-dur,6s) cubic-bezier(.65,0,.35,1) infinite}
.word-swap-right .word-swap-a,.word-swap-right .word-swap-b{animation-delay:calc(var(--swap-dur,6s) * .04)}
}
@keyframes wordSwapA{0%,42%{opacity:1;transform:none;filter:blur(0)}50%,92%{opacity:0;transform:translateY(-.18em);filter:blur(6px)}100%{opacity:1;transform:none;filter:blur(0)}}
@keyframes wordSwapB{0%,42%{opacity:0;transform:translateY(.18em);filter:blur(6px)}50%,92%{opacity:1;transform:none;filter:blur(0)}100%{opacity:0;transform:translateY(.18em);filter:blur(6px)}}

.work-shimmer{color:var(--ink);background-repeat:no-repeat;background-position:0% 0}
@supports ((-webkit-background-clip:text) or (background-clip:text)){.work-shimmer{-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}}
@media (prefers-reduced-motion:no-preference){.work-shimmer{animation:workShimmer var(--shimmer-cycle,5s) linear infinite}}

</style>

<script>
class Component extends DCLogic {
  /* Bright accents (palette: "bright accent on white") used for hovered project names in the Work dropdown. */
  hoverTextList() {
    const p = this.props;
    return [
      p.hoverTextAgent ?? '#007EC2',
      p.hoverTextUpsell ?? '#D85100',
      p.hoverTextConnect ?? '#21934C',
      p.hoverTextHabitwave ?? '#7937E8',
      p.hoverTextAbleJobs ?? '#D23B65'
    ];
  }
  accentList() {
    const p = this.props;
    return [
      p.accentAgent ?? '#95CEE3',
      p.accentUpsell ?? '#E3A37C',
      p.accentConnect ?? '#8AC9A1',
      p.accentHabitwave ?? '#AC8FE6',
      p.accentAbleJobs ?? '#CE9895'
    ];
  }
  smokeVals() {
    const p = this.props;
    return {
      bg: p.pageBackground ?? '#ffffff',
      sc: p.smokeColor ?? '#9aa0ad',
      amt: p.smokeAmount ?? 0.12,
      speed: p.smokeSpeed ?? 0.35,
      scale: p.smokeScale ?? 1.6,
      accentAmt: p.accentSmokeAmount ?? 0.3,
      tint: p.accentBackgroundTint ?? 0.12
    };
  }
  hexToRgb(h) {
    h = String(h || '').replace('#', '');
    if (h.length === 3) h = h.split('').map(c => c + c).join('');
    const n = parseInt(h.slice(0, 6), 16);
    return isNaN(n) ? [1, 1, 1] : [((n >> 16) & 255) / 255, ((n >> 8) & 255) / 255, (n & 255) / 255];
  }
  mixRgb(a, b, t) { return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t]; }
  activeIndex() {
    const s = this.state || {};
    return (s.workOpen || this.props.showWorkMenu) && s.activeWork != null ? s.activeWork : null;
  }
  // What the page and smoke should settle on right now.
  smokeTarget() {
    const v = this.smokeVals(), base = this.hexToRgb(v.bg), idx = this.activeIndex();
    if (idx == null) return { bg: base, sc: this.hexToRgb(v.sc), amt: v.amt };
    const acc = this.hexToRgb(this.accentList()[idx]);
    return { bg: this.mixRgb(base, acc, v.tint), sc: acc, amt: Math.max(v.amt, v.accentAmt) };
  }
  cssRgb(c) { return 'rgb(' + c.map(x => Math.round(x * 255)).join(',') + ')'; }
  startSmoke() {
    const cv = this.smokeCanvas;
    const gl = cv && cv.getContext('webgl', { antialias: false });
    if (!gl) return;
    const vs = 'attribute vec2 p;void main(){gl_Position=vec4(p,0.,1.);}';
    const fs = 'precision mediump float;uniform vec2 r;uniform float t;uniform vec3 bg;uniform vec3 sc;uniform float amt;uniform float sca;' +
      'float h(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}' +
      'float n(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(h(i),h(i+vec2(1.,0.)),f.x),mix(h(i+vec2(0.,1.)),h(i+vec2(1.,1.)),f.x),f.y);}' +
      'float fbm(vec2 p){float v=0.,a=.5;for(int i=0;i<5;i++){v+=a*n(p);p=p*2.02+vec2(1.7,9.2);a*=.5;}return v;}' +
      'void main(){vec2 uv=gl_FragCoord.xy/r.y*sca;vec2 q=vec2(fbm(uv+vec2(0.,t*.12)),fbm(uv+vec2(5.2,1.3)-vec2(t*.08,0.)));float f=fbm(uv+1.8*q+vec2(t*.05,-t*.03));float m=smoothstep(.35,.9,f)*amt;gl_FragColor=vec4(mix(bg,sc,m),1.);}';
    const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
    const prog = gl.createProgram();
    gl.attachShader(prog, sh(gl.VERTEX_SHADER, vs));
    gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, fs));
    gl.linkProgram(prog);
    if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) return;
    gl.useProgram(prog);
    const buf = gl.createBuffer();
    gl.bindBuffer(gl.ARRAY_BUFFER, buf);
    gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
    const loc = gl.getAttribLocation(prog, 'p');
    gl.enableVertexAttribArray(loc);
    gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
    const u = name => gl.getUniformLocation(prog, name);
    const uR = u('r'), uT = u('t'), uBg = u('bg'), uSc = u('sc'), uA = u('amt'), uS = u('sca');
    const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
    let visible = true, last = '', elapsed = 0, prev = performance.now();
    let cur = null;
    const draw = (time, c) => {
      const w = Math.max(1, Math.round(cv.clientWidth * 0.5)), hgt = Math.max(1, Math.round(cv.clientHeight * 0.5));
      if (cv.width !== w || cv.height !== hgt) { cv.width = w; cv.height = hgt; gl.viewport(0, 0, w, hgt); }
      gl.uniform2f(uR, w, hgt); gl.uniform1f(uT, time);
      gl.uniform3f(uBg, c.bg[0], c.bg[1], c.bg[2]); gl.uniform3f(uSc, c.sc[0], c.sc[1], c.sc[2]);
      gl.uniform1f(uA, c.amt); gl.uniform1f(uS, this.smokeVals().scale);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    };
    const loop = now => {
      this.smokeRaf = requestAnimationFrame(loop);
      const dt = Math.min(0.1, (now - prev) / 1000); prev = now;
      if (!visible) return;
      const target = this.smokeTarget();
      if (reduce.matches || !cur) {
        cur = { bg: target.bg.slice(), sc: target.sc.slice(), amt: target.amt };
      } else {
        // Ease toward the active accent so the colour shift feels like it drifts in.
        const k = 1 - Math.exp(-dt * 3.5);
        cur = { bg: this.mixRgb(cur.bg, target.bg, k), sc: this.mixRgb(cur.sc, target.sc, k), amt: cur.amt + (target.amt - cur.amt) * k };
      }
      if (reduce.matches) {
        const key = JSON.stringify(cur) + this.smokeVals().scale + cv.clientWidth + 'x' + cv.clientHeight;
        if (key !== last) { last = key; draw(12, cur); }
        return;
      }
      elapsed += dt * this.smokeVals().speed;
      draw(12 + elapsed, cur);
    };
    if ('IntersectionObserver' in window) {
      this.smokeIo = new IntersectionObserver(([e]) => { visible = e.isIntersecting; });
      this.smokeIo.observe(cv);
    }

        style: '--o: ' + o.toFixed(2) + '; --f: ' + (1 - q[3] / U).toFixed(3) + '; opacity: ' + o.toFixed(2) };
    });
    this._loaderKey = key;
    this._loader = { dur: (p.loaderSpeed ?? 2.4) + 's', dots, viewBox: '0 0 ' + VW + ' ' + VH, width: em + 'em', height: (em * VH / VW).toFixed(3) + 'em' };
    return this._loader;
  }
  /* "Work" shimmer: one band holding every dropdown accent sweeps across the word, then the word rests in ink until the next sweep. */
  shimmerStyle() {
    const p = this.props, sweep = Math.max(0.2, p.shimmerSeconds ?? 2.2), every = Math.max(sweep, p.shimmerEvery ?? 5);
    const r = sweep / every, W = r / (2 + r);          // the word's share of the gradient strip
    const pct = v => (v * 100).toFixed(2) + '%';
    const acc = this.hoverTextList(), stops = ['var(--ink) 0%', 'var(--ink) ' + pct(W)];   // bright accents, same as the dropdown hover text
    acc.forEach((c, i) => stops.push(c + ' ' + pct(W + W * (i + 1) / (acc.length + 1))));
    stops.push('var(--ink) ' + pct(2 * W), 'var(--ink) 100%');
    return { image: 'linear-gradient(90deg, ' + stops.join(', ') + ')', size: (100 / W).toFixed(1) + '%', cycle: every + 's' };
  }
  /* Intro reel: jump cuts on a loop before the page appears. Frames are images when introImages has URLs, otherwise typographic placeholders. */
  introImages() { return ['assets/canvas/4d83ef052420.png', 'assets/canvas/49515b1a6e7c.png', 'assets/canvas/5a3beaae42d4.png']; }
  introFrames() {
    const imgs = this.introImages();
    if (imgs.length) return imgs.map(src => ({ src }));
    const soft = this.accentList();
    const bright = ['#007EC2', '#D85100', '#21934C', '#7937E8', '#D23B65'];
    const words = ['Dalí', 'Feynman', 'art', 'science', '✦'];
    return words.map((w, i) => ({ text: w, bg: soft[i % soft.length], fg: bright[i % bright.length] }));
  }
  introShouldPlay() {
    if (this.props.showIntro === false) return false;
    try { if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return false; } catch (e) {}
    if (this.props.introOncePerSession !== false) { try { if (sessionStorage.getItem('vm-intro-seen')) return false; } catch (e) {} }
    return true;
  }
  startIntro(el) {
    const frameEl = el.querySelector('.intro-frame');
    const frames = this.introFrames();
    const cut = Math.max(60, this.props.introCutMs ?? 200);
    const total = Math.max(500, (this.props.introSeconds ?? 3) * 1000);
    frames.forEach(f => { if (f.src) { const im = new Image(); im.src = f.src; } });
    let i = 0;
    const show = () => {
      const f = frames[i % frames.length]; i++;
      if (f.src) {
        frameEl.style.background = '#ffffff';
        frameEl.innerHTML = '<img src="' + f.src + '" alt="" style="height:min(40vh,300px);width:auto;max-width:80vw;object-fit:contain;display:block">';
      } else {
        frameEl.style.background = f.bg;
        frameEl.innerHTML = '<span style="font:600 clamp(64px,16vw,240px)/0.9 \'Bricolage Grotesque\',Manrope,sans-serif;letter-spacing:-0.04em;color:' + f.fg + '">' + f.text + '</span>';
      }
    };
    show();
    this.introTick = setInterval(show, cut);
    this.introEnd = setTimeout(() => this.finishIntro(), total);
  }
  finishIntro() {
    clearInterval(this.introTick); clearTimeout(this.introEnd);
    try { sessionStorage.setItem('vm-intro-seen', '1'); } catch (e) {}
    const el = this.introEl;
    if (el) { el.style.opacity = '0'; el.style.pointerEvents = 'none'; }
    clearTimeout(this.introFade);
    this.introFade = setTimeout(() => { this.introActive = false; this.setState({ introTick: Date.now() }); }, 460);
  }
  componentWillUnmount() { clearInterval(this.introTick); clearTimeout(this.introEnd); clearTimeout(this.introFade); this.stopSmoke(); this.stopGlass(); }
  renderVals() {
    if (this.introActive === undefined) this.introActive = this.introShouldPlay();
    const wantIntro = this.props.showIntro !== false;
    if (this.lastShowIntro === false && wantIntro) this.introActive = true;
    if (!wantIntro) this.introActive = false;
    this.lastShowIntro = wantIntro;
    if (!this.setIntro) {
      this.setIntro = el => {
        if (el === this.introEl) return;
        clearInterval(this.introTick); clearTimeout(this.introEnd);
        this.introEl = el;
        if (el) this.startIntro(el);
      };
      this.skipIntro = () => this.finishIntro();
    }
    if (!this.setCardVideo) {
      this.setCardVideo = el => {
        if (el === this.cardVideo) return;
        if (this.cardVideoObs) { this.cardVideoObs.disconnect(); this.cardVideoObs = null; }
        this.cardVideo = el;
        if (!el) return;
        const reduce = window.matchMedia('(prefers-reduced-motion: reduce)');
        let visible = false;
        const sync = () => { if (visible && !reduce.matches && !document.hidden) el.play().catch(() => {}); else el.pause(); };
        if ('IntersectionObserver' in window) {
          this.cardVideoObs = new IntersectionObserver(([e]) => { visible = e.isIntersecting; sync(); }, { threshold: 0.12 });
          this.cardVideoObs.observe(el);
        }
        document.addEventListener('visibilitychange', sync);
      };
    }
    if (!this.setSmokeCanvas) {
      this.setSmokeCanvas = el => {
        if (el === this.smokeCanvas) return;
        this.stopSmoke();
        this.smokeCanvas = el;
        if (el) this.startSmoke();
      };
    }
    if (!this.setGlassCanvas) {
      this.setGlassCanvas = el => {
        if (el === this.glassCanvas) return;
        this.stopGlass();
        this.glassCanvas = el;
        if (el) this.startGlass();
      };
    }
    const s = this.state || {};
    const open = !!(s.workOpen || this.props.showWorkMenu);
    const idx = this.activeIndex();
    const accents = this.accentList();
    const vals = {
      introOn: !!this.introActive,
      setIntro: this.setIntro,
      setCardVideo: this.setCardVideo,
      skipIntro: this.skipIntro,
      setSmokeCanvas: this.setSmokeCanvas,
      setGlassCanvas: this.setGlassCanvas,
      loader: this.loaderGeometry(),
      shimmer: this.shimmerStyle(),
      swapDur: (this.props.wordSwapSeconds ?? 6) + 's',
      pageBg: this.cssRgb(this.smokeTarget().bg),
      workOpen: open,
      workList: open && (this.props.workMenuStyle ?? 'overlay') === 'list',
      workOverlay: open && (this.props.workMenuStyle ?? 'overlay') !== 'list',
      workMenuId: (this.props.workMenuStyle ?? 'overlay') === 'list' ? 'work-menu' : 'work-popover',
      workExpanded: String(open),
      workChevron: open ? '▴' : '▾',
      toggleWork: () => this.setState({ workOpen: !s.workOpen, activeWork: null }),
      clearWork: () => this.setState({ activeWork: null }),
      workKeyDown: e => { if (e.key === 'Escape') this.setState({ workOpen: false, activeWork: null }); }
    };
    accents.forEach((color, i) => {
      const rgb = this.hexToRgb(color).map(x => Math.round(x * 255)).join(',');
      vals['work' + i] = { color, active: String(idx === i), text: idx === i ? this.hoverTextList()[i] : 'var(--ink)', enter: () => this.setState({ activeWork: i }) };
    });
    return vals;
  }
}
window.Component = Component;
</script>
