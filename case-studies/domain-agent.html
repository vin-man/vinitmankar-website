<h1>From vague intent to a <em>confident domain choice.</em></h1>
<p class="lede">I designed an AI-guided experience that interprets an early business idea, recommends relevant domains, and helps customers move confidently toward registration.</p>

<h2>Airo knew the customer.<br/><em>The Domain Agent knew the task.</em></h2>
</div>
<div class="section-copy reveal">
<p>GoDaddy was evolving Airo into a coordinated system of specialized agents. Airo maintained customer context and directed work to the right product expert.</p>
<p>My focus was defining how the Domain Agent should understand intent, present recommendations, and support a purchase—without becoming an interrogation or an endless chat.</p>

<h2>“I want to buy a domain”<br/><em>isn’t a complete brief.</em></h2>
<p>The same request could come from a first-time founder, an established business, or someone adding a new venture. The agent needed enough context to be relevant—while minimizing questions and preserving control.</p>

<div class="strategy-title reveal"><p class="kicker">THE INTERACTION MODEL</p><h2>Three modes for three kinds of thinking.</h2></div>
<div class="principles">
<article class="principle reveal"><span>01</span><img alt="" aria-hidden="true" class="principle-ornament principle-sparkle" src="assets/airo-sparkle-brokenup.svg"/><h3><em>Conversation</em><br/>to understand intent.</h3><p>Use natural language when the customer’s goal is still fluid.</p></article>
<article class="principle reveal"><span>02</span><img alt="" aria-hidden="true" class="principle-ornament principle-logo" src="assets/airo-logo-3d.png"/><h3><em>Structure</em><br/>to compare options.</h3><p>Move names, extensions, availability, and price into a scannable surface.</p></article>
<article class="principle reveal"><span>03</span><div aria-hidden="true" class="airo-loader"><img alt="" src="assets/airo-loader-dot-1.svg"/><img alt="" src="assets/airo-loader-dot-2.svg"/><img alt="" src="assets/airo-loader-dot-3.svg"/></div><h3><em>Clear actions</em><br/>to make a decision.</h3><p>Reduce uncertainty as the customer moves from exploration to commitment.</p></article>
</div>

<section class="decision shell">
<div class="decision-copy reveal">
<p class="kicker">DESIGN DECISION · 01</p>
<h2>Reuse context before asking questions.</h2>
<p>When Airo already knew about a customer’s ventures, the agent surfaced them as editable choices. Customers could confirm an existing business or start something new without repeating information.</p>
<p class="takeaway">Ask customers to verify known context—not recreate it.</p>
</div>

<div class="decision-copy reveal">
<p class="kicker">DESIGN DECISION · 02</p>
<h2>Gather intent progressively.</h2>
<p>For a new venture, the agent asked only what would improve the next recommendation. Each answer became a visible signal—not information disappearing into an opaque model.</p>
<p class="takeaway">Every question should improve what comes next.</p>
</div>

<p>Waiting, refinement, recovery, and handoff were treated as part of the core journey—not edge cases. When the system could not respond, the experience explained what happened and kept retry close at hand.</p>
<ul><li>Empty and onboarding</li><li>Search and refinement</li><li>Error recovery</li><li>Registration handoff</li></ul>

<script>
class Component extends DCLogic {
  /* Home link Möbius loader (same geometry as the homepage footer loader): dots sampled on a real half-twisted strip, seen from a raised three-quarter angle. */
  homeLoaderGeometry() {
    const p = this.props;
    const dotSize = p.homeLoaderDotSize ?? 3, bandW = p.homeLoaderBandWidth ?? 0.36;
    const U = Math.round(p.homeLoaderDensity ?? 52), V = Math.round(p.homeLoaderRows ?? 6), em = p.homeLoaderWidth ?? 34;
    const key = [dotSize, bandW, U, V, em, p.homeLoaderSpeed ?? 8].join('|');
    if (this._homeLoaderKey === key) return this._homeLoader;
    const pitch = -1.2, yaw = 1.9, dur = 2.4, pts = [];
    for (let i = 0; i < U; i++) {
      const u = i / U * 2 * Math.PI, c = Math.cos(u), sn = Math.sin(u), ch = Math.cos(u / 2), sh = Math.sin(u / 2);
      for (let j = 0; j < V; j++) {
        const v = (V === 1 ? 0 : j / (V - 1) - 0.5) * bandW;
        let x = c + v * ch * c, y = sn + v * ch * sn, z = v * sh;
        const x2 = x * Math.cos(yaw) - y * Math.sin(yaw), y2 = x * Math.sin(yaw) + y * Math.cos(yaw);
        const y3 = y2 * Math.cos(pitch) - z * Math.sin(pitch), z3 = y2 * Math.sin(pitch) + z * Math.cos(pitch);
        pts.push([x2, -y3, z3, i]);
      }
    }
    let minx = Infinity, maxx = -Infinity, miny = Infinity, maxy = -Infinity, zmin = Infinity, zmax = -Infinity;
    for (const q of pts) { minx = Math.min(minx, q[0]); maxx = Math.max(maxx, q[0]); miny = Math.min(miny, q[1]); maxy = Math.max(maxy, q[1]); zmin = Math.min(zmin, q[2]); zmax = Math.max(zmax, q[2]); }

    const family = { '95CEE3': '#007EC2', 'E3A37C': '#D85100', '8AC9A1': '#21934C', 'AC8FE6': '#7937E8', 'CE9895': '#D23B65',
      'C2C5D0': '#5265C7', 'C9C9C9': '#565D6C', 'CBC7C2': '#836247', 'D5C8C2': '#C45162', 'B3DAD9': '#008C91', 'C0B9B1': '#947044', 'D6D293': '#958000', 'FF362B': '#EF2518' };
    vals.pageAccent = p.pageAccentColor ?? family[hex.toUpperCase()] ?? '#141414';

  }
