<!-- "Design notes" switch, removed from the Growth case study nav on 2026-11-11. Kept for reuse.
     Markup (canvas): put inside the nav, pushed right. aria-pressed drives the on state. -->
<span style="margin-left: auto"><button aria-pressed="{{ notesPressed }}" class="notes-toggle" onClick="{{ toggleNotes }}" type="button"><span aria-hidden="true" class="toggle-mark"></span>Design notes</button></span>

<!-- Logic (in renderVals):
     const notes = this.current('showDesignNotes', false);
     vals.notesHidden = !notes; vals.notesPressed = String(!!notes);
     vals.toggleNotes = () => this.setState({ showDesignNotes: !notes }); -->

<style>
/* from case-studies/domain-agent-studio.css */
.notes-toggle{display:flex;align-items:center;gap:9px;background:none;border:0;padding:9px 0;font-size:12px}
.toggle-mark{position:relative;width:26px;height:15px;border-radius:30px;background:#e8eae8;transition:background .2s}
.toggle-mark:after{content:'';position:absolute;top:3px;left:3px;width:9px;height:9px;background:white;border-radius:50%;box-shadow:0 1px 3px #0002;transition:translate .2s}
.notes-toggle[aria-pressed=true] .toggle-mark{background:var(--accent)}
.notes-toggle[aria-pressed=true] .toggle-mark:after{translate:11px 0}
@media (max-width:560px){.notes-toggle{font-size:11px;gap:6px}}
</style>
